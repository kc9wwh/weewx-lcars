###############################################################################
# LCARS skin for WeeWX 5                                                      #
# A Titan.DS-inspired console theme: console, radar scope and wall display.   #
###############################################################################

SKIN_NAME = LCARS
SKIN_VERSION = 0.1.1

[Extras]

    # Big name at the top of every page. Blank uses "location" from weewx.conf.
    station_title = ""

    # Sensors in the "Additional sensors" list, in order. Any sensor with no
    # current data is skipped automatically, so it is safe to list extras.
    secondary = dewpoint, windchill, heatindex, appTemp, cloudbase, barometer

    # The one sensor whose connector line is drawn in coral.
    highlight = appTemp

    # Six meters on the wall display (kiosk.html), left to right.
    kiosk_meters = outTemp, outHumidity, dewpoint, windSpeed, cloudbase, rain

    # Seconds between full reloads of the wall display.
    kiosk_refresh = 300

    # Forecast from Open-Meteo (no key needed). Set to false to hide it.
    forecast = true
    forecast_days = 3

    # Active alerts from the US National Weather Service (api.weather.gov).
    # Severe or extreme alerts switch every page to red alert; others go amber.
    nws_alerts = true

    # Condition amber also triggers from today's forecast when either is met.
    # amber_gust is in your display units for wind (mph, km/h, m/s or knots).
    amber_gust = 40
    amber_precip_probability = 80

    # Radar scope (radar.html). Rings are drawn at real distances on the map.
    radar_rings = 5, 10, 15, 20
    radar_ring_unit = mi
    radar_tiles = https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png
    radar_attribution = NEXRAD via Iowa Environmental Mesonet
    basemap_tiles = https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png
    basemap_attribution = © OpenStreetMap contributors © CARTO

###############################################################################

[Units]
    [[StringFormats]]
        inHg = %.2f

###############################################################################

[Labels]
    [[Generic]]
        outTemp = Outside temp
        outHumidity = Humidity
        dewpoint = Dew point
        windchill = Wind chill
        heatindex = Heat index
        appTemp = Apparent
        cloudbase = Cloud base
        barometer = Barometer
        pressure = Pressure
        windSpeed = Wind
        windGust = Gust
        windDir = Direction
        windrun = Wind run
        rain = Rain
        rainRate = Rain rate
        UV = UV index
        radiation = Solar
        inTemp = Inside temp
        inHumidity = Inside humidity

###############################################################################

[CheetahGenerator]
    encoding = utf8
    [[SummaryByMonth]]
        [[[month_summary]]]
            template = month-%Y-%m.html.tmpl
            stale_age = 1800
        [[[NOAA_month]]]
            encoding = normalized_ascii
            template = NOAA/NOAA-%Y-%m.txt.tmpl
            stale_age = 1800
    [[SummaryByYear]]
        [[[year_summary]]]
            template = year-%Y.html.tmpl
            stale_age = 3600
        [[[NOAA_year]]]
            encoding = normalized_ascii
            template = NOAA/NOAA-%Y.txt.tmpl
            stale_age = 3600
    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl
        [[[radar]]]
            template = radar.html.tmpl
        [[[kiosk]]]
            template = kiosk.html.tmpl
        [[[yesterday]]]
            template = yesterday.html.tmpl
            stale_age = 3600
        [[[week]]]
            template = week.html.tmpl
        [[[month]]]
            template = month.html.tmpl
            stale_age = 1800
        [[[year]]]
            template = year.html.tmpl
            stale_age = 3600
        [[[history]]]
            template = history.html.tmpl
            stale_age = 3600
        [[[archive_index]]]
            template = archive.json.tmpl
            stale_age = 3600

###############################################################################

[CopyGenerator]
    copy_once = fonts/*.woff2, vendor/*.js, vendor/*.css, favicon.svg, LICENSES.txt
    copy_always = lcars.css, lcars.js

###############################################################################

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
